    display: flex;
    flex-direction: column;
    gap: 40px;
  }

  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--faint);
    margin: 0 0 18px;
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
  }

  .name {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(42px, 11vw, 60px);
    line-height: 1.02;
    letter-spacing: -0.01em;
    text-wrap: balance;
    margin: 0;
  }

  .role {
    font-family: var(--mono);
    font-size: 13.5px;
    color: var(--accent);
    letter-spacing: .01em;
    margin: 14px 0 0;
  }

  .bio {
    font-size: 16.5px;
    color: var(--muted);
    max-width: 46ch;
    text-wrap: pretty;
    margin: 18px 0 0;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 15px 18px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 13px;
    text-decoration: none;
    color: var(--text);
    box-shadow: var(--shadow);
    transition: border-color .18s ease, transform .18s ease, background .18s ease;
  }
  .link:hover,
  .link:focus-visible {
    border-color: var(--accent);
    background: var(--surface-2);
    transform: translateY(-2px);
    outline: none;
  }
  .link:focus-visible { box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow); }

  .ico {
    flex: none;
    width: 22px;
    height: 22px;
    color: var(--muted);
    transition: color .18s ease;
  }
  .link:hover .ico,
  .link:focus-visible .ico { color: var(--accent); }

  .meta { display: flex; flex-direction: column; min-width: 0; gap: 1px; }
  .meta .label { font-weight: 550; font-size: 15.5px; }
  .meta .sub {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .arrow {
    margin-left: auto;
    flex: none;
    width: 16px;
    height: 16px;
    color: var(--faint);
    transition: transform .18s ease, color .18s ease;
  }
  .link:hover .arrow,
  .link:focus-visible .arrow { color: var(--accent); transform: translate(3px, -3px); }

  .foot {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--faint);
    text-align: center;
    border-top: 1px solid var(--border);
    padding-top: 26px;
  }

  @media (prefers-reduced-motion: reduce) {
    .link, .ico, .arrow { transition: none; }
  }
</style>
